<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chris Neff</title>
  <style>
    :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #555; --bg: #fff; --link: #0b57d0; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8e8e8; --muted: #aaa; --bg: #121212; --link: #8ab4f8; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           box-sizing: border-box; background: var(--bg); color: var(--fg);
           font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>Chris Neff</h1>
    <p><a href="https://github.com/ChrisNeff">GitHub</a></p>
  </main>
</body>
</html>
